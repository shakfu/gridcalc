

name: Build and Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: false
        default: false
        type: boolean

env:
  # Per-version wheels for cp310-cp313 (matches pyproject.toml
  # `requires-python = ">=3.10"`). The abi3 build lives in a separate
  # workflow (`build-abi3.yml`) for cp312+.
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
  CIBW_SKIP: "*-musllinux_* pp*"
  CIBW_TEST_REQUIRES: pytest
  CIBW_TEST_COMMAND: pytest {project}/tests -v
  CIBW_ENVIRONMENT: GRIDCALC_SANDBOX=1

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build web UI bundle
        uses: ./.github/actions/build-web-ui

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 14

  build-wheels-linux:
    name: Build wheels (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build web UI bundle
        uses: ./.github/actions/build-web-ui

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_LINUX: x86_64

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: wheelhouse/*.whl
          retention-days: 14

  build-wheels-linux-arm:
    name: Build wheels (Linux aarch64)
    # Native arm64 runner (free for public repos). Building aarch64 via QEMU
    # emulation on an x86_64 runner compiles OpenXLSX ~10-50x slower and blew
    # past the 6h job limit; native builds finish in minutes.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build web UI bundle
        uses: ./.github/actions/build-web-ui

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_LINUX: aarch64

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-arm
          path: wheelhouse/*.whl
          retention-days: 14

  build-wheels-macos:
    name: Build wheels (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build web UI bundle
        uses: ./.github/actions/build-web-ui

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_MACOS: x86_64 arm64
          # cibuildwheel's default x86_64 target (10.9) is too old: nanobind
          # needs C++17 aligned new/delete (10.13+) and OpenXLSX uses
          # std::filesystem (10.15+). 10.15 satisfies both. arm64 keeps its
          # 11.0 floor regardless.
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: wheelhouse/*.whl
          retention-days: 14

  build-wheels-windows:
    name: Build wheels (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build web UI bundle
        uses: ./.github/actions/build-web-ui

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_WINDOWS: AMD64

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: wheelhouse/*.whl
          retention-days: 14

  collect-artifacts:
    name: Collect all build artifacts
    needs:
      [
        build-sdist,
        build-wheels-linux,
        build-wheels-linux-arm,
        build-wheels-macos,
        build-wheels-windows,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Download Linux wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels-linux
          path: dist/

      - name: Download Linux arm wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels-linux-arm
          path: dist/

      - name: Download macOS wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels-macos
          path: dist/

      - name: Download Windows wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels-windows
          path: dist/

      - name: List all artifacts
        run: |
          echo "=== All build artifacts ==="
          ls -la dist/
          echo ""
          echo "=== Wheel count: $(ls dist/*.whl 2>/dev/null | wc -l) ==="
          echo "=== Sdist count: $(ls dist/*.tar.gz 2>/dev/null | wc -l) ==="

      # Guards the failure this was written after: `wheel.packages` collection
      # consults .gitignore, and the web UI bundle is a gitignored build
      # artifact -- so the one file `gridcalc-web` needs was silently the one
      # file left out, while ~350 kB of client TypeScript sources shipped in its
      # place. Checked on the finished artifacts rather than the source tree,
      # because that is where the mistake was invisible.
      - name: Verify every distribution carries the web UI bundle
        run: |
          python3 - <<'PY'
          import pathlib, sys, tarfile, zipfile

          BUNDLE = "gridcalc/web/static/index.html"
          problems = []

          for whl in sorted(pathlib.Path("dist").glob("*.whl")):
              names = zipfile.ZipFile(whl).namelist()
              if BUNDLE not in names:
                  problems.append(f"{whl.name}: missing {BUNDLE}")
              stowaways = [n for n in names if "/web/frontend/" in n]
              if stowaways:
                  problems.append(
                      f"{whl.name}: ships {len(stowaways)} client source files "
                      f"(e.g. {stowaways[0]})"
                  )

          for sdist in sorted(pathlib.Path("dist").glob("*.tar.gz")):
              names = tarfile.open(sdist).getnames()
              # An sdist must be buildable, so it keeps the client sources -- but
              # it needs the bundle too, or a wheel built from it has no UI.
              if not any(n.endswith("src/" + BUNDLE) for n in names):
                  problems.append(f"{sdist.name}: missing src/{BUNDLE}")

          if problems:
              print("::error::distribution contents are wrong")
              for p in problems:
                  print("  -", p)
              sys.exit(1)
          print("all distributions carry the bundle and no client sources")
          PY

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: all-dist
          path: dist/
          retention-days: 30

  publish-testpypi:
    name: Publish to TestPyPI
    needs: collect-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gridcalc
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [collect-artifacts, publish-testpypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/gridcalc
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-manual:
    name: Manual Publish to PyPI
    needs: collect-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    environment:
      name: pypi
      url: https://pypi.org/p/gridcalc
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
