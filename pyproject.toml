[project]
name = "gridcalc"
version = "0.3.3"
description = "A terminal / web spreadsheet powered by Python formulas"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# The wheel statically links vendored HiGHS (MIT) and OpenXLSX
# (BSD-3-Clause), so their licence texts have to travel with the binary, not
# just live in the source tree. THIRD-PARTY-NOTICES.md is the inventory.
license-files = [
    "LICENSE",
    "THIRD-PARTY-NOTICES.md",
    "thirdparty/HiGHS/LICENSE.txt",
    "thirdparty/HiGHS/THIRD_PARTY_NOTICES.md",
    "thirdparty/OpenXLSX/LICENSE.md",
]
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
keywords = ["spreadsheet", "terminal", "tui", "curses", "calculator", "visicalc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=1.0; python_version < '3.11'",
    # curses is Unix-only in the stdlib; windows-curses (a PDCurses wrapper)
    # provides it on Windows so the TUI entry point runs there.
    "windows-curses>=2.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
# A single extras bundle. Either install the core (zero third-party
# runtime deps) or `gridcalc[extras]` for everything: numpy enables
# ndarray formulas and LAPACK-backed solvers, pandas enables
# DataFrame formulas and the `:pd` commands, pygments enables
# syntax-highlighted code preview in the trust prompt.
extras = ["numpy>=1.24", "pandas>=2.0", "pygments>=2.15"]
# Experimental web frontend (see docs/gui.md): an editable grid rendered in a
# desktop webview. The engine stays in-process on CPython; pywebview embeds the
# OS webview and bridges to it. `pip install gridcalc[web]` then `gridcalc-web`.
web = ["pywebview>=5.0"]

[dependency-groups]
dev = [
    "build>=1.0",
    "mypy>=1.19.1",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pandas-stubs>=2.0",
    "pygments>=2.15",
    "pytest",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.15.7",
    "twine>=6.2.0",
    "types-Pygments>=2.15",
]
# The documentation site (`make docs`). Kept out of `dev` because it is a
# large tree of unrelated packages that neither the test suite nor the QA
# gate needs; `uv run --group docs` pulls it only when the site is built.
# mkdocstrings reads the sources statically (griffe), so building the docs
# does not require the compiled `_core`/`_opt` extensions.
docs = [
    # Capped below 2.0: mkdocs-material's own release notes say MkDocs 2.0
    # removes the plugin system entirely, which would take mkdocstrings, the
    # search plugin, and the theme with it.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
gridcalc = "gridcalc.tui:main"
gridcalc-web = "gridcalc.web:run_cli"

[project.urls]
Homepage = "https://github.com/shakfu/gridcalc"
Repository = "https://github.com/shakfu/gridcalc"
Issues = "https://github.com/shakfu/gridcalc/issues"

[build-system]
requires = ["scikit-build-core>=0.8", "nanobind"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/gridcalc"]
cmake.args = []
cmake.define = {}
cmake.build-type = "Release"
cmake.source-dir = "."
# The web UI bundle is a build artifact and is gitignored, and
# scikit-build-core's file collection consults .gitignore -- so without an
# explicit entry the one file `gridcalc-web` needs is the one file left out of
# the distribution. Naming the exact source force-includes it.
sdist.include = ["src/gridcalc/web/static/index.html"]
sdist.exclude = []
wheel.force-include = {"src/gridcalc/web/static/index.html" = "gridcalc/web/static/index.html"}
# The client's TypeScript sources belong in the sdist (it has to be buildable)
# but not in a wheel, which only ever loads the compiled bundle. Leaving them in
# shipped ~350 kB of .tsx, tests, and a 136 kB package-lock.json to every user.
wheel.exclude = ["gridcalc/web/frontend/**"]

[tool.ruff]
target-version = "py310"
line-length = 100
# `thirdparty/` holds vendored HiGHS and OpenXLSX checkouts, whose Python
# example scripts are not ours to lint. The Make targets scope Ruff to the
# owned paths anyway; this keeps a bare `ruff check` (and editor integrations,
# which read this config and not the Makefile) reporting the same thing.
exclude = ["thirdparty"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["S307", "S603", "S605", "S108", "S102", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# The `web` extra is optional; the web frontend imports webview lazily.
# Ignore the missing import so a checkout without the extra still typechecks.
[[tool.mypy.overrides]]
module = ["webview", "webview.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Default test run excludes the slow PTY-driven curses integration tests.
# Run them explicitly with `make test-tty` or `pytest -m tty tests/integration`.
addopts = "-m 'not tty and not browser'"
markers = [
    "tty: PTY-driven curses integration test (slow, requires pty + xterm-256color)",
    "browser: Playwright-driven web-frontend render test (slow, requires chromium)",
    "tui_file(path): preload gridcalc with this file on launch",
]
